<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login — Serena Wedding</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Jost',sans-serif;background:#0d1a14;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:8px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
    .logo{text-align:center;margin-bottom:32px}
    .logo h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;color:#1A1A18}
    .logo h1 em{font-style:italic;color:#B8935B}
    .logo p{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:#7A7A74;margin-top:4px}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
    label{font-size:.8rem;font-weight:500;color:#1A1A18}
    .inp-wrap{position:relative}
    input{width:100%;border:1px solid rgba(184,147,91,.3);border-radius:3px;padding:11px 40px 11px 14px;font-family:'Jost',sans-serif;font-size:.9rem;color:#1A1A18;outline:none;transition:border-color .3s,box-shadow .3s}
    input:focus{border-color:#2B4D3F;box-shadow:0 0 0 3px rgba(43,77,63,.08)}
    .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#7A7A74;font-size:.85rem}
    .btn-login{width:100%;background:#2B4D3F;color:#fff;border:none;border-radius:3px;padding:13px;font-family:'Jost',sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;margin-top:8px;transition:background .3s}
    .btn-login:hover{background:#1d3d31}
    .err{background:#fee;border:1px solid #fcc;border-radius:3px;padding:10px 14px;font-size:.82rem;color:#c00;margin-bottom:16px;display:none}
    .back{display:block;text-align:center;margin-top:20px;font-size:.8rem;color:#7A7A74;text-decoration:none}
    .back:hover{color:#2B4D3F}
    .hint{background:#f5f2eb;border-radius:4px;padding:10px 14px;font-size:.78rem;color:#6E685F;margin-top:16px;line-height:1.6}
    .hint code{background:#e8e3d8;padding:1px 5px;border-radius:2px;font-family:monospace}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Serena <em>Wedding</em></h1>
    <p>Admin CMS Panel</p>
  </div>
  <div class="err" id="errMsg">Username atau password salah.</div>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <div class="inp-wrap"><input type="text" id="username" autocomplete="username" placeholder="admin" value="admin" required/></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="inp-wrap">
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" value="serena2026" required/>
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan password"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="btn-login">Masuk ke Dashboard</button>
  </form>
  <div class="hint">Login CMS Default:<br/>Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>serena2026</code></div>
  <a href="../index.html" class="back">← Kembali ke Website</a>
</div>
<script>
  const CREDS = { username:'admin', password:'serena2026' };
  document.getElementById('togglePw').addEventListener('click',function(){
    const inp = document.getElementById('password');
    const icon = this.querySelector('i');
    if(inp.type==='password'){inp.type='text';icon.className='fas fa-eye-slash';}
    else{inp.type='password';icon.className='fas fa-eye';}
  });
  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('errMsg');
    if(u===CREDS.username && p===CREDS.password){
      sessionStorage.setItem('cms_auth','1');
      localStorage.setItem('cms_auth','1');
      window.location.href='dashboard.html';
    } else {
      err.style.display='block';
      document.getElementById('password').value='';
    }
  });
  // If already logged in, redirect directly to dashboard
  if(sessionStorage.getItem('cms_auth')==='1' || localStorage.getItem('cms_auth')==='1'){
    window.location.href='dashboard.html';
  }
</script>
</body>
</html>
